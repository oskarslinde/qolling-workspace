name: Business Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  business-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            hera/package-lock.json
            business-tests/package-lock.json

      - name: Install Hera dependencies
        working-directory: hera
        run: npm ci

      - name: Install business-tests dependencies
        working-directory: business-tests
        run: npm ci

      - name: Validate feature coverage mapping
        run: npm run check:feature-coverage --prefix business-tests

      - name: Install Playwright Chromium
        working-directory: business-tests
        run: npx playwright install --with-deps chromium

      - name: Run business tests
        run: npm test --prefix business-tests
