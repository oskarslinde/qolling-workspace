<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qolling Task Manager</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Qolling</p>
        <h1>Task Manager</h1>
        <p class="subtitle">Review, queue, and track Qolling work from the Markdown task files.</p>
      </div>
      <div class="header-actions">
        <button id="refreshButton" type="button" class="secondary">Refresh</button>
      </div>
    </header>

    <main>
      <section class="status-bar" aria-live="polite">
        <span id="connectionStatus">Connecting...</span>
        <span id="taskCount">0 tasks</span>
      </section>

      <section id="board" class="board" aria-label="Task board"></section>

      <details id="executionPanel" class="execution-panel">
        <summary class="execution-panel-summary">
          <div class="execution-summary">
            <p class="eyebrow">Execution</p>
            <h2 id="executionHeadline">No execution has started yet.</h2>
            <p id="executionMeta" class="subtitle"></p>
          </div>
        </summary>
        <div class="execution-panel-body" aria-live="polite">
          <div class="execution-progress">
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="currentTaskText" class="current-task"></p>
          </div>
          <div>
            <h3 class="panel-title">Current Batch Log</h3>
            <div id="executionLog" class="log-list"></div>
          </div>
          <details id="executionHistoryPanel" class="history-panel">
            <summary class="history-panel-summary">
              <h3 class="panel-title">Execution History</h3>
            </summary>
            <div id="executionHistory" class="history-list"></div>
          </details>
        </div>
      </details>
    </main>

    <dialog id="taskDialog" class="task-dialog" aria-labelledby="dialogTitle">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <p id="dialogSection" class="eyebrow"></p>
            <h2 id="dialogTitle"></h2>
          </div>
          <button type="submit" class="icon-button" aria-label="Close task details">x</button>
        </div>
        <dl id="dialogDetails" class="task-details"></dl>
        <div id="dialogActions" class="dialog-actions"></div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
